[project]
name = "quiver-mutation-barriers"
version = "1.0"
description = "Tasks, batches and records behind the claims of 'How High Must a Mutation Path Climb?'"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

# What the scheduler (taskbatch/) is told about this repository: see taskbatch/PROTOCOL.md.
[tool.taskbatch]
runner = ["{python}", "-I", "runners/task_runner.py"]
description_keys = []

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["experiments", "verify", "tools/renumber_results.py", "tools/make_manifest.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# sentences of the generated pages, kept on one line each
"tools/claims.py" = ["E501"]
"tools/expected.py" = ["E501"]
# rows of tables and lines of logs, as they are printed
"tests/test_claims.py" = ["E501"]
"tests/test_task_runner.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["taskbatch", "qmb", "runners", "tools/claims.py", "tools/expected.py"]
