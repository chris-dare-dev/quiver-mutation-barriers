name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5 mypy==2.4.1
      - run: make lint
      - name: The root holds src/, tests/, data/, research/ and the standard files
        run: python3 .github/check_root.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.5.4
      - name: Fast tests
        run: make test
      - name: The generated claim tables are up to date
        run: make check
      - name: Smoke batch, and the headline table of the guide from it
        run: make smoke
