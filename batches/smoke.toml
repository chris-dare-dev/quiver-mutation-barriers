# The headline numbers of the article, recomputed from the definition of mutation: what verify/smoke.py
# checks, as tasks.  About 110 tasks, a minute or two on a laptop, standard library only, no data
# archive.  The certificate programs of experiments/ are included (verify/smoke_certificates.sh).

name = "smoke"

[scheduler]
workers = 4
memory_budget_mb = 2000

[limits]
time_seconds = 300
memory_mb = 500

# The running example, R_8 = (-8, -8, 7, -2, 6, -8)
[[tasks]]
kind = "quiver"
family = "R"
values = [8]

[[tasks]]
kind = "reach"
family = "R"
values = [8]

# G_k, Theorem 5.1
[[tasks]]
kind = "barrier"
family = "G"
range = [3, 12]

[[tasks]]
kind = "reach"
family = "G"
values = [8]

[[tasks]]
kind = "route"
family = "G"
values = [8]

# R_b, Theorem 7.2 (even b >= 6; odd b is computational), and Q_t, Section 7
[[tasks]]
kind = "barrier"
family = "R"
range = [5, 14]

[[tasks]]
kind = "route"
family = "R"
values = [6, 8, 10, 12, 14]

[[tasks]]
kind = "route"
family = "R"
values = [6, 8, 10, 12, 14]
method = "shortest"

[[tasks]]
kind = "barrier"
family = "Qt"
values = [3, 4]

# P+_t on five vertices, Theorem 9.1
[[tasks]]
kind = "quiver"
family = "P+"
values = [2, 3]

[[tasks]]
kind = "barrier"
family = "P+"
values = [2, 3]

[[tasks]]
kind = "reach"
family = "P+"
values = [2, 3]

[[tasks]]
kind = "route"
family = "P+"
values = [2, 3]

[[tasks]]
kind = "route"
family = "P+"
values = [2, 3]
method = "shortest"

# Q_a on five vertices, Theorem 10.1 and Proposition 10.2
[[tasks]]
kind = "quiver"
family = "Qa"
values = [2, 3, 4, 7]

[[tasks]]
kind = "barrier"
family = "Qa"
values = [2, 3, 4]

[[tasks]]
kind = "route"
family = "Qa"
values = [2, 3, 7, 12]

[[tasks]]
kind = "route"
family = "Qa"
values = [2, 3]
method = "shortest"

# Conjecture 5.5 at small height, Proposition 12.1
[[tasks]]
kind = "conj55"
heights = [1, 2, 3, 4]

# The three certificate programs: 30, 43 and 938 claims
[[tasks]]
kind = "certificate"
names = ["R_b", "Q_t", "P+_t"]
audit_tmax = 7
