# P+_t for 2 <= t <= 80 by the two enumerators of the original runs, with no pruning (Theorem 9.1):
# the number of quivers reached below 2t^5 - t^4 + t^2 - 1 (1,561,537 at t = 64, 3,054,100 at t = 80),
# with P+_t the only one of height at most t^2; and, where a search can reach it, the join itself.
#
#   np_barrier   the C search (experiments/np_barrier.c; needs `make build`).  It holds entries in 32
#                bits.  The barrier is below 2^31 for t <= 64 and above it from t = 65 (2,302,734,849),
#                so its 32 tasks for 65 <= t <= 80 end `unsupported`.  They stay in the batch so that
#                the gap shows in the records.
#   review17     the second enumerator (verify/review17.py plain, note 17), in Python integers, for the
#                whole range.  For t <= 64 both enumerators compute the same count; from t = 65 it is
#                the only one, as in the original runs.
#
# For 65 <= t <= 80 no search finds the join.  What is computed there is what the theorem's argument
# uses: the route of height exactly the barrier (replayed), and that nothing else of height at most
# t^2 lies below it (review17).
#
# The C search takes two minutes in all.  The second enumerator takes up to about a minute and 1 GB
# for one value of t near 80.

name = "long-pplus"

[scheduler]
workers = 4
memory_budget_mb = 12000

[limits]
time_seconds = 600
memory_mb = 1000

[[limits.tier]]
min_cost = 40
time_seconds = 1800
memory_mb = 1500

[[limits.tier]]
min_cost = 65
time_seconds = 3600
memory_mb = 3000

[[tasks]]
kind = "barrier"
family = "P+"
range = [2, 80]
method = "np_barrier"

[[tasks]]
kind = "reach"
family = "P+"
range = [2, 80]
method = "np_barrier"

[[tasks]]
kind = "reach"
family = "P+"
range = [2, 80]
method = "review17"

[[tasks]]
kind = "route"
family = "P+"
range = [65, 80]
