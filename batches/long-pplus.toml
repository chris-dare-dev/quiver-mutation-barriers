# P+_t by the C search with no pruning (Theorem 9.1): the barrier 2t^5 - t^4 + t^2 - 1, and the number
# of quivers reached below it (1,561,537 at t = 64).  Needs `make build`.  Two minutes of computing in
# all; the largest task takes under 3 s and 200 MB.
#
# The C search holds entries in 32 bits.  The barrier is below 2^31 for t <= 64 and above it from
# t = 65 (2,302,734,849), so the 32 tasks for 65 <= t <= 80 end `unsupported`: this method cannot
# compute them.  They are kept in the batch so that the gap shows in the records.  The original runs
# used a second enumerator for that range (verify/review17.py plain, note 17); no task runs it.

name = "long-pplus"

[scheduler]
workers = 4
memory_budget_mb = 6000

[limits]
time_seconds = 600
memory_mb = 1000

[[limits.tier]]
min_cost = 40
time_seconds = 1800
memory_mb = 1500

[[tasks]]
kind = "barrier"
family = "P+"
range = [2, 80]
method = "np_barrier"

[[tasks]]
kind = "reach"
family = "P+"
range = [2, 80]
method = "np_barrier"
