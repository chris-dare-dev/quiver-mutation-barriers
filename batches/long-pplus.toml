# LONG RUN.  P+_t for 2 <= t <= 80 by the C search with no pruning (Theorem 9.1: "search for t <= 80"):
# the barrier 2t^5 - t^4 + t^2 - 1, and the number of quivers reached below it (1,561,537 at t = 64).
# The original logs record about 4 minutes for t <= 64 and about a minute per value from 65 to 80.
# Needs `make build`.  The search holds up to about 0.5 GB per task.

name = "long-pplus"

[scheduler]
workers = 4
memory_budget_mb = 6000

[limits]
time_seconds = 600
memory_mb = 1000

[[limits.tier]]
min_cost = 40
time_seconds = 1800
memory_mb = 1500

[[tasks]]
kind = "barrier"
family = "P+"
range = [2, 80]
method = "np_barrier"

[[tasks]]
kind = "reach"
family = "P+"
range = [2, 80]
method = "np_barrier"
