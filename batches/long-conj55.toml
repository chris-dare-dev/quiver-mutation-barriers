# LONG RUN.  Conjecture 5.5 to height 18 (Proposition 12.1) by the original program
# (experiments/n4_conj55.py run, resolve, summary), as one task: the per-height table, the totals and
# the split of the failing quivers by certificate.  The original logs record 27 minutes and 11 GB for
# `run` and 41 minutes on 4 processes for `resolve`.  Needs numpy (experiments/requirements.txt).
# The task has the whole budget: nothing else of this batch runs beside it.

name = "long-conj55"

[scheduler]
workers = 1
memory_budget_mb = 16000

[limits]
time_seconds = 10800
memory_mb = 16000

[[tasks]]
kind = "conj55_program"
N = 18
workers = 4
