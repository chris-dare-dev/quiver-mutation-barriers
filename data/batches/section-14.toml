# Section 14, back to the attacker: the generic search of the section (research/experiments/np_barrier.c, a
# lowest-bottleneck-first search with no pruning) on the three families.  For each quiver: the height at
# which the search first meets another quiver as low as the start, and that this quiver is the
# opposite.  Needs `make build` (a C compiler).  Under a minute.

name = "section-14"

[scheduler]
workers = 4
memory_budget_mb = 4000

[limits]
time_seconds = 300
memory_mb = 1000

[[tasks]]
kind = "barrier"
family = "R"
values = [6, 8, 10, 16, 20, 30, 40, 60]
method = "np_barrier"

[[tasks]]
kind = "barrier"
family = "P+"
range = [2, 16]
method = "np_barrier"

[[tasks]]
kind = "barrier"
family = "Qa"
range = [2, 12]
method = "np_barrier"
