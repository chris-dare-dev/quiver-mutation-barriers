# The registry of claims: every row of the claim tables of CLAIMS.md.
#
# tools/claims.py writes the tables of CLAIMS.md, the file claims/RECORDS.md and the headline table of
# GUIDE.md from this file, from the batch files (which tasks exist), from claims/expected.json
# (predicted values and stored evidence) and from the records in records/.  `make check` fails if
# the committed tables differ from what it writes.
#
# A table has a heading of CLAIMS.md and its columns.  A claim has an id, its table, the cells of its
# row in the order of the columns (Markdown, as printed), and `tasks`: ids of the tasks that compute
# it, where `*` stands for any run of characters.  A `*` may not follow a digit: `t=3*` would also take
# t = 30, so the ids of one parameter value are written out.  A claim without tasks says why in
# `no_task`.
# Negative controls (ids ending in "!control") never count for a claim.

[table.status]
heading = '''The status table, row by row'''
columns = ['''Article''', '''Paper''', '''Support''', '''Script and command''', '''Stored output''', '''Run time, memory''']

